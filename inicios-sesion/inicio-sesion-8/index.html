<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesión — Wave Fluid Auth</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Iconos Vectoriales Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <!-- Fondo SVG de Olas Fluidas Animadas -->
      <div class="background">
        <svg
          version="1.1"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          x="0px"
          y="0px"
          width="100%"
          height="100%"
          viewBox="0 0 1600 900"
        >
          <defs>
            <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="30%" stop-color="#4BAEFE" stop-opacity="0.85" />
              <stop offset="85%" stop-color="#9035FF" stop-opacity="0.85" />
            </linearGradient>
            <path
              id="wave"
              fill="url(#bgGradient)"
              d="M-363.852,502.589c0,0,236.988-41.997,505.475,0
      s371.981,38.998,575.971,0s293.985-39.278,505.474,5.859s493.475,48.368,716.963-4.995v560.106H-363.852V502.589z"
            />
          </defs>
          <g>
            <use xlink:href="#wave" opacity=".35">
              <animateTransform
                attributeName="transform"
                attributeType="XML"
                type="translate"
                dur="8s"
                calcMode="spline"
                values="270 230; -334 180; 270 230"
                keyTimes="0; .5; 1"
                keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
                repeatCount="indefinite"
              />
            </use>
            <use xlink:href="#wave" opacity=".6">
              <animateTransform
                attributeName="transform"
                attributeType="XML"
                type="translate"
                dur="6s"
                calcMode="spline"
                values="-270 230;243 220;-270 230"
                keyTimes="0; .6; 1"
                keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
                repeatCount="indefinite"
              />
            </use>
            <use xlink:href="#wave" opacity=".9">
              <animateTransform
                attributeName="transform"
                attributeType="XML"
                type="translate"
                dur="4s"
                calcMode="spline"
                values="0 230;-140 200;0 230"
                keyTimes="0; .4; 1"
                keySplines="0.42, 0, 0.58, 1.0;0.42, 0, 0.58, 1.0"
                repeatCount="indefinite"
              />
            </use>
          </g>
        </svg>
      </div>

      <!-- Logotipo -->
      <img src="logo.svg" class="logo" alt="Logo" />

      <!-- Pestañas Conmutadoras -->
      <div class="toggle login-active">
        <button type="button" onclick="toggleView('login')" id="btn-toggle-login">
          <span>Iniciar Sesión</span>
        </button>
        <button type="button" onclick="toggleView('register')" id="btn-toggle-register">
          <span>Registrarse</span>
        </button>
      </div>

      <!-- Formularios -->
      <div class="forms">
        <!-- Formulario Iniciar Sesión -->
        <form class="form login active" onsubmit="event.preventDefault()">
          <div class="textbox">
            <i class="bx bx-envelope input-icon"></i>
            <input required type="email" autocomplete="email" placeholder=" " id="signin-email" />
            <label for="signin-email">Correo electrónico</label>
          </div>

          <div class="textbox">
            <i class="bx bx-lock-alt input-icon"></i>
            <input required type="password" class="pass-input" autocomplete="current-password" placeholder=" " id="signin-pass" />
            <label for="signin-pass">Contraseña</label>
            <button type="button" class="toggle-pass-btn" aria-label="Mostrar u ocultar contraseña">
              <i class="bx bx-hide"></i>
            </button>
          </div>

          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>

          <button type="submit" class="submit-btn">
            <p><span>INICIAR SESIÓN</span></p>
            <i class="bx bx-right-arrow-alt arrow-icon"></i>
          </button>
        </form>

        <!-- Formulario Registrarse -->
        <form class="form register" onsubmit="event.preventDefault()">
          <div class="textbox">
            <i class="bx bx-user input-icon"></i>
            <input required type="text" autocomplete="name" placeholder=" " id="signup-name" />
            <label for="signup-name">Nombre completo</label>
          </div>

          <div class="textbox">
            <i class="bx bx-envelope input-icon"></i>
            <input required type="email" autocomplete="email" placeholder=" " id="signup-email" />
            <label for="signup-email">Correo electrónico</label>
          </div>

          <div class="textbox">
            <i class="bx bx-lock-alt input-icon"></i>
            <input required type="password" class="pass-input" autocomplete="new-password" placeholder=" " id="signup-pass" />
            <label for="signup-pass">Contraseña</label>
            <button type="button" class="toggle-pass-btn" aria-label="Mostrar u ocultar contraseña">
              <i class="bx bx-hide"></i>
            </button>
          </div>

          <button type="submit" class="submit-btn">
            <p><span>CREAR CUENTA</span></p>
            <i class="bx bx-right-arrow-alt arrow-icon"></i>
          </button>
        </form>
      </div>

      <p class="footer">
        Al utilizar este software aceptas nuestra <a href="#">política de privacidad</a> y <a href="#">términos de uso</a>.
      </p>
    </div>

    <script src="main.js"></script>
  </body>
</html>
