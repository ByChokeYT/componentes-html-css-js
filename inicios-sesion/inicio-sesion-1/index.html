<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,1,0"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/akar-icons-fonts"></script>
  </head>
  <body>
    <div class="card">
      <ul class="card-nav">
        <span class="active-bar"></span>
        <li>
          <img src="assets/logo.svg" alt="Logo" />
        </li>
        <li>
          <button
            type="button"
            class="signin active"
            onclick="selectView('signin')"
          >
            <i class="ai-person-check"></i>
            <span>Ingresar</span>
          </button>
        </li>
        <li>
          <button type="button" class="signup" onclick="selectView('signup')">
            <i class="ai-person-add"></i>
            <span>Registro</span>
          </button>
        </li>
      </ul>
      <div class="card-hero">
        <div class="card-hero-inner">
          <div class="card-hero-content signin">
            <h2>¡Bienvenido!</h2>
            <h3>Ingresa tus credenciales para acceder.</h3>
            <img src="assets/signin.svg" alt="Iniciar Sesión" />
          </div>
          <div class="card-hero-content signup">
            <h2>Crea tu cuenta</h2>
            <h3>Únete a nuestra plataforma hoy mismo.</h3>
            <img src="assets/signup.svg" alt="Registro" />
          </div>
        </div>
      </div>
      <div class="card-form">
        <div class="forms">
          <form id="signin" class="active" onsubmit="event.preventDefault()">
            <p>¿No tienes una cuenta? <a href="#" onclick="selectView('signup'); return false;">Regístrate aquí</a>.</p>
            <label>Correo Electrónico</label>
            <div class="control">
              <input type="email" placeholder="tucorreo@gmail.com" />
              <i class="ai-envelope"></i>
            </div>
            <label>Contraseña</label>
            <div class="control">
              <input type="password" placeholder="●●●●●●●●●●●●●●●" />
              <i class="ai-lock-on"></i>
            </div>
            <button>INICIAR SESIÓN</button>
            <p class="footer">
              Al hacer clic en Iniciar Sesión, aceptas nuestros términos y condiciones y políticas de privacidad.
            </p>
          </form>
          <form id="signup" onsubmit="event.preventDefault()">
            <p>¿Ya tienes una cuenta? <a href="#" onclick="selectView('signin'); return false;">Inicia sesión</a>.</p>
            <label>Nombre de Usuario</label>
            <div class="control">
              <input type="text" placeholder="miusuario" />
              <i class="ai-person"></i>
            </div>
            <label>Correo Electrónico</label>
            <div class="control">
              <input type="email" placeholder="tucorreo@gmail.com" />
              <i class="ai-envelope"></i>
            </div>
            <label>Contraseña</label>
            <div class="control">
              <input type="password" placeholder="●●●●●●●●●●●●●●●" />
              <i class="ai-lock-on"></i>
            </div>
            <button>REGISTRARSE</button>
          </form>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
