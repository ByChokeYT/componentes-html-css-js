<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barra Lateral VII — Redimensionable con Arrastre</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,1,0"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/akar-icons-fonts"></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="handle" title="Arrastra para cambiar el tamaño"></div>
      <div class="sidebar-inner">
        <header>
          <img class="logo-icon" src="logo-icon.svg" alt="Icono del logo" />
          <img class="logo-text" src="logo-text.svg" alt="Texto del logo" />
        </header>
        <ul>
          <li>
            <button type="button" class="nav-item active">
              <i class="ai-dashboard"></i>
              <p>Panel Principal</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-grid"></i>
              <p>Aplicaciones</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-folder"></i>
              <p>Archivos</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-lock-on"></i>
              <p>Cuentas</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-person"></i>
              <p>Usuarios</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-location"></i>
              <p>Ubicaciones</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-bell"></i>
              <p>Notificaciones</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-cart"></i>
              <p>Productos</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-triangle-alert"></i>
              <p>Advertencias</p>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item">
              <i class="ai-gear"></i>
              <p>Configuración</p>
            </button>
          </li>
        </ul>
      </div>
    </aside>
    <script type="text/javascript" src="main.js"></script>
  </body>
</html>
