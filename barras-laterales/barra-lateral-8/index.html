<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barra Lateral VIII — Cristal Frosted con Indicador Azul</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,1,0"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/akar-icons-fonts"></script>
  </head>
  <body>
    <aside class="sidebar open" id="sidebar">
      <header>
        <button
          type="button"
          class="sidebar-burger"
          onclick="toggleOpen()"
          title="Alternar menú lateral"
        >
          <i class="ai-three-line-horizontal"></i>
        </button>
        <img src="logo.svg" alt="Logo de la marca" class="logo-img" />
      </header>
      <nav class="menu" id="sidebar-nav">
        <button type="button" class="menu-btn active" data-tooltip="Inicio">
          <i class="ai-home-alt1"></i>
          <p>Inicio</p>
        </button>
        <button type="button" class="menu-btn" data-tooltip="Resumen">
          <i class="ai-eye-open"></i>
          <p>Resumen</p>
        </button>
        <button type="button" class="menu-btn" data-tooltip="Calificaciones">
          <i class="ai-star"></i>
          <p>Calificaciones</p>
        </button>
        <button type="button" class="menu-btn" data-tooltip="Productos">
          <i class="ai-shipping-box-v1"></i>
          <p>Productos</p>
        </button>
        <button type="button" class="menu-btn" data-tooltip="Tendencias">
          <i class="ai-arrow-up-right"></i>
          <p>Tendencias</p>
        </button>
        <button type="button" class="menu-btn" data-tooltip="Bandeja de Entrada">
          <i class="ai-envelope"></i>
          <p>Bandeja de Entrada</p>
        </button>
        <button type="button" class="menu-btn" data-tooltip="Configuración">
          <i class="ai-gear"></i>
          <p>Configuración</p>
        </button>
      </nav>
    </aside>
    <script src="main.js"></script>
  </body>
</html>
